# =============================================================================
# Overlay: Linux host, draw directly on the host X server.
# Layered on top of compose.yaml. Do not use this file on its own.
#
# Works on both X11 and Wayland sessions. On Wayland the apps go through
# XWayland, which is why QT_QPA_PLATFORM stays xcb -- Gazebo's Qt GUI is not
# reliable on the native Wayland platform plugin.
#
# This is the fastest option on Linux: real GPU, no video encode/decode round
# trip. Requires an X socket at /tmp/.X11-unix and, for GPU rendering, a
# render node at /dev/dri. A headless Linux server has neither -- use the
# default (browser) configuration there instead.
# =============================================================================
services:
  dev:
    environment:
      DISPLAY: ${DISPLAY:-:0}
      # Force native: if the socket turns out to be unreachable,
      # start-display.sh still falls back to the browser desktop rather than
      # leaving you with no GUI at all.
      DRONE_DISPLAY_MODE: ${DRONE_DISPLAY_MODE:-native}

    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix

      # X ACCESS CONTROL. There are two mechanisms in the wild and this
      # supports both without you having to know which you have:
      #
      #  1. SI:localuser (modern default on Wayland/XWayland sessions).
      #     The server authorizes by the PEER'S UID over the unix socket.
      #     No cookie exists or is needed -- it works as long as the container
      #     user's uid matches yours. VS Code's updateRemoteUserUID does that
      #     remapping automatically on Linux hosts.
      #
      #  2. MIT-MAGIC-COOKIE (traditional Xorg). Needs the cookie file.
      #     scripts/doctor.sh extracts one to /tmp/.docker.xauth and sets
      #     XAUTH_FILE.
      #
      # The default is /dev/null, which bind-mounts as an empty, always-present
      # file. X clients read no entries from it and send no auth data, which is
      # exactly right for case 1. Never use `xhost +local:` to work around
      # this: it disables access control for every local process, not just
      # this container.
      - ${XAUTH_FILE:-/dev/null}:/home/ros/.Xauthority:ro

    # Direct Rendering Interface. Needed for Intel/AMD GPU acceleration.
    # NVIDIA users get their devices injected by the nvidia runtime instead,
    # but having this present is harmless on an NVIDIA box.
    devices:
      - /dev/dri:/dev/dri

    # Lets X11 MIT-SHM work against the host server.
    ipc: host
