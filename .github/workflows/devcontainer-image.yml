# =============================================================================
# Builds and publishes the dev container image for BOTH architectures.
#
# WHY THIS EXISTS
# ---------------
# Building the image locally compiles PX4, which takes 20-40 minutes on a
# student laptop. Doing that once here, centrally, means everyone else just
# pulls a finished image and is working in about five minutes.
#
# WHY TWO NATIVE RUNNERS INSTEAD OF ONE QEMU BUILD
# ------------------------------------------------
# The obvious approach -- one job with buildx + QEMU emulating arm64 -- does
# work, but emulated compilation of PX4 plus Fast DDS is roughly an order of
# magnitude slower and routinely blows past job time limits. GitHub provides
# native arm64 runners (free for public repos), so each architecture is built
# on its own hardware and the two are stitched into one manifest list at the
# end. Apple Silicon users then pull a NATIVE arm64 image.
# =============================================================================
name: Build dev container image

on:
  push:
    branches: [main, dev]
    paths:
      - '.devcontainer/**'
      - '.github/workflows/devcontainer-image.yml'
  pull_request:
    paths:
      - '.devcontainer/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image name
        # Container registries require the repository part of a reference to be
        # lowercase, but github.repository preserves the owner/repo casing as
        # typed on GitHub ("VIP-FLIE/DroneSwarming"). Feeding that straight to
        # buildx fails at the very END of the build -- every layer compiles,
        # then the push is rejected -- so it is normalised here instead of
        # being hardcoded, which would also break on forks.
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}-dev" >> "$GITHUB_ENV"

      - name: Free up disk space
        # The ROS desktop + Gazebo + a compiled PX4 tree is a large image and
        # the default runner image ships with several GB of preinstalled
        # toolchains we do not need. Without this the build dies on ENOSPC.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .devcontainer
          file: .devcontainer/Dockerfile
          platforms: ${{ matrix.platform }}
          # PX4 is compiled into the image here so students never wait for it.
          build-args: PREBUILD_PX4=1
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  merge:
    # Stitches the two single-arch images into ONE tag that resolves to the
    # right architecture automatically. This is what lets every student use the
    # identical DRONE_IMAGE value regardless of their laptop.
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Resolve image name
        # Container registries require the repository part of a reference to be
        # lowercase, but github.repository preserves the owner/repo casing as
        # typed on GitHub ("VIP-FLIE/DroneSwarming"). Feeding that straight to
        # buildx fails at the very END of the build -- every layer compiles,
        # then the push is rejected -- so it is normalised here instead of
        # being hardcoded, which would also break on forks.
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}-dev" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list
        working-directory: /tmp/digests
        run: |
          TAGS="-t ${REGISTRY}/${IMAGE_NAME}:jazzy"
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            TAGS="$TAGS -t ${REGISTRY}/${IMAGE_NAME}:latest"
          fi
          # shellcheck disable=SC2046
          docker buildx imagetools create $TAGS \
            $(printf "${REGISTRY}/${IMAGE_NAME}@sha256:%s " *)

      - name: Show what was published
        run: docker buildx imagetools inspect ${REGISTRY}/${IMAGE_NAME}:jazzy
