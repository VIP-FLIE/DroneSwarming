services:
  development:
    image: drone-swarming:px4-${PX4_VERSION}
    build:
      context: .
      args:
        PX4_BASE_IMAGE: ${PX4_BASE_IMAGE:?Set PX4_BASE_IMAGE in .env}
        UBUNTU_VERSION: ${UBUNTU_VERSION:?Set UBUNTU_VERSION in .env}
        ROS_DISTRO: ${ROS_DISTRO:?Set ROS_DISTRO in .env}
        CC: ${CC:?Set CC in .env}
        CXX: ${CXX:?Set CXX in .env}
        PX4_VERSION: ${PX4_VERSION:?Set PX4_VERSION in .env}
        PX4_MSGS_VERSION: ${PX4_MSGS_VERSION:?Set PX4_MSGS_VERSION in .env}
        RUFF_VERSION: ${RUFF_VERSION:?Set RUFF_VERSION in .env}
        DRONE_LOG_MIN_SEVERITY: ${DRONE_LOG_MIN_SEVERITY:-DEBUG}
    command: ["sleep", "infinity"]
    init: true
    network_mode: host
    stdin_open: true
    tty: true
    environment:
      PX4_GZ_WORLD: ${PX4_GZ_WORLD:-vip_windy}
      PX4_GZ_MODEL: ${PX4_GZ_MODEL:-vip_x500}
      PX4_PARAM_SIM_BAT_DRAIN: ${PX4_PARAM_SIM_BAT_DRAIN:-900}
    volumes:
      - .:/workspace:rw
      - ./px4/server.config:/opt/PX4-Autopilot/src/modules/simulation/gz_bridge/server.config:ro
      - ./px4/gz_env.sh:/opt/PX4-Autopilot/build/px4_sitl_default/rootfs/gz_env.sh:ro
      - development_build:/workspace/build
      - development_install:/workspace/install
      - development_log:/workspace/log

  simulation:
    container_name: swarm-sim
    build:
      context: .
      args:
        PX4_BASE_IMAGE: ${PX4_BASE_IMAGE:?Set PX4_BASE_IMAGE in .env}
        UBUNTU_VERSION: ${UBUNTU_VERSION:?Set UBUNTU_VERSION in .env}
        ROS_DISTRO: ${ROS_DISTRO:?Set ROS_DISTRO in .env}
        CC: ${CC:?Set CC in .env}
        CXX: ${CXX:?Set CXX in .env}
        PX4_VERSION: ${PX4_VERSION:?Set PX4_VERSION in .env}
        PX4_MSGS_VERSION: ${PX4_MSGS_VERSION:?Set PX4_MSGS_VERSION in .env}
        RUFF_VERSION: ${RUFF_VERSION:?Set RUFF_VERSION in .env}
        DRONE_LOG_MIN_SEVERITY: ${DRONE_LOG_MIN_SEVERITY:-DEBUG}
    image: drone-swarming:px4-${PX4_VERSION}
    command: ["sleep", "infinity"]
    init: true
    network_mode: host
    stdin_open: true
    tty: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      DISPLAY: ${DISPLAY:-}
      XAUTHORITY: /dev/null
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,graphics,display
      PX4_GZ_WORLD: ${PX4_GZ_WORLD:-vip_windy}
      PX4_GZ_MODEL: ${PX4_GZ_MODEL:-vip_x500}
      PX4_PARAM_SIM_BAT_DRAIN: ${PX4_PARAM_SIM_BAT_DRAIN:-900}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      - ./src:/workspace/src:rw
      - ./scripts:/workspace/scripts:ro
      - ./px4/server.config:/opt/PX4-Autopilot/src/modules/simulation/gz_bridge/server.config:ro
      - ./px4/gz_env.sh:/opt/PX4-Autopilot/build/px4_sitl_default/rootfs/gz_env.sh:ro
      - ./worlds:/workspace/worlds:ro
      - ./run-logs:/workspace/run-logs:rw

volumes:
  development_build:
  development_install:
  development_log:
